# Local load balancer: two API instances, passive failover.
# The web app runs on the host (pnpm dev) and is proxied through as well,
# so the browser only ever talks to this one origin.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;

  upstream erp_api {
    least_conn;
    server api-1:4000 max_fails=2 fail_timeout=10s;
    server api-2:4000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection '';

    location ~ ^/(graphql|health|auth|upload)(/|$) {
      proxy_pass http://erp_api;
      # Retry the other instance only when nothing was sent, or for safe methods.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }

    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
