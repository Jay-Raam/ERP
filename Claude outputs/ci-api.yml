name: ci-api

on:
  push:
    paths: ['apps/api/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-api.yml']

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp_ci, POSTGRES_DB: erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:8
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://erp:erp_ci@localhost:5432/erp_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/api --filter @erp/shared lint
      - run: pnpm --filter @erp/api --filter @erp/shared typecheck
      - run: pnpm --filter @erp/shared test
      - run: pnpm --filter @erp/api test:coverage --reporter=default --reporter=json --outputFile=coverage/results.json
      - name: Backend report
        if: always()
        run: node scripts/backend-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-report
          path: apps/api/coverage
          retention-days: 14
