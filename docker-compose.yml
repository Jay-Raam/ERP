# Local development only. Credentials here are throwaway and bound to localhost.
#   pnpm infra:up   -> postgres, mongo, redis (run the apps with pnpm dev)
#   pnpm stack:up   -> also two API instances behind Nginx on http://localhost:8080
name: erp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_only
      POSTGRES_DB: erp
    ports: ['127.0.0.1:5432:5432']
    volumes: ['./.data/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports: ['127.0.0.1:27017:27017']
    volumes: ['./.data/mongo:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['./.data/redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api-1: &api
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: api-1
      CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgres://erp:erp_local_only@postgres:5432/erp
      MONGO_URL: mongodb://mongo:27017/erp
      REDIS_URL: redis://redis:6379
      # Local stack only. Real deployments inject their own secret.
      JWT_SECRET: local-stack-only-secret-not-for-real-use-000
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  nginx:
    profiles: [stack]
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./nginx/nginx.conf:/etc/nginx/nginx.conf:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on: [api-1, api-2]
