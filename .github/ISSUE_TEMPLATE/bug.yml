name: Bug
description: Something works differently from what was agreed
title: 'fix(<module>): '
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the request ID shown with the error }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
